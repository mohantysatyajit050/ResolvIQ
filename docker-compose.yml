name: resolviq

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resolviq-postgres
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: resolviq_dev_password
      POSTGRES_DB: resolviq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolviq -d resolviq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: resolviq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: docker.io/pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    container_name: resolviq-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: Admin
      MINIO_ROOT_PASSWORD: admin@123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - storage_data:/data

  mailpit:
    image: axllent/mailpit
    container_name: resolviq-mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

volumes:
  postgres_data:
  redis_data:
  storage_data:
